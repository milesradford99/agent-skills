name: Release

# Runs only when a maintainer pushes a version tag (vX.Y.Z).
on:
  push:
    tags: ["v*.*.*"]

permissions: {}

jobs:
  release:
    name: Package skills and create GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate
        run: |
          python3 scripts/validate_skills.py
          python3 -m unittest discover -s tests

      - name: Check tag matches plugin versions
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'EOF'
          import json, os, sys
          version = os.environ["TAG"].removeprefix("v")
          plugins = json.load(open(".claude-plugin/marketplace.json"))["plugins"]
          wrong = [p["name"] for p in plugins if p.get("version") != version]
          if wrong:
              sys.exit(f"Tag v{version} doesn't match the version of: {', '.join(wrong)}")
          print(f"All plugins are at {version}")
          EOF

      - name: Zip each skill
        run: |
          mkdir -p dist
          cd skills
          for skill in */; do
            skill="${skill%/}"
            zip -r "../dist/${skill}.zip" "$skill"
          done
          ls -l ../dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/*.zip --title "$TAG" --generate-notes --verify-tag
